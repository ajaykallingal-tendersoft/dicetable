# flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/png/solo_logo.png"

  # Android configuration
  android: "launcher_icon"
  min_sdk_android: 21

  # Adaptive icon configuration for Android
#  adaptive_icon_background: "#8825A4"  # Your desired background color
  adaptive_icon_foreground: "assets/png/solo_logo.png"

  # iOS configuration
  ios: true
  remove_alpha_channel_ios: true

